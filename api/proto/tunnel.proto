// OpsOrigin Reverse Tunnel Protocol
// Core ↔ Proxy ↔ Agent 三层边缘穿透通信协议
syntax = "proto3";
package tunnel;
option go_package = "./;tunnel";

service TunnelService {
  // Proxy 通过此接口与 Core 建立双向多路复用隧道
  rpc Connect(stream TunnelMessage) returns (stream TunnelMessage);
}

message TunnelMessage {
  string message_id = 1;
  string trace_id = 2;
  string proxy_id = 3;
  oneof payload {
    RegisterRequest register = 10;
    RegisterResponse register_resp = 11;
    Heartbeat heartbeat = 20;
    CommandRequest command = 30;
    CommandResponse command_resp = 31;
    AgentCommand forward = 40;
    AgentResponse forward_resp = 41;
    // 监控/CMDB 指标批量上报(任务归任务、上报归上报: Agent 本地调度后经此主动上报)
    MetricBatch metrics = 50;
  }
}

// MetricPoint 单个指标点。labels 承载维度(CPU 核号/磁盘挂载点/网卡名等)。
message MetricPoint {
  string name = 1;
  double value = 2;
  map<string, string> labels = 3;
  string unit = 4;
}

// MetricBatch 一次批量上报: 一个任务/一批指标点的集合。
// task_type 供 Core 分流: cmdb(低频→PG) | monitor(高频→VM)。
message MetricBatch {
  string task_id = 1;
  string task_type = 2;      // cmdb | monitor | metric
  int64 timestamp = 3;       // 采集时间(unix 秒)
  int64 interval_sec = 4;    // 采集周期, Core 侧可据此估算心跳/时序
  repeated MetricPoint points = 5;
}

message RegisterRequest {
  string proxy_id = 1;
  string version = 2;
  string hostname = 3;
  repeated string capabilities = 4;
  // 系统信息:Agent 注册时随隧道一并上报,供 Core 回写 agent_hosts
  // (OS/IP/CPU/Memory),避免 gRPC 直连 Agent 在 UI 中显示为无资源信息的空壳。
  string os = 5;
  string os_version = 6;
  string cpu = 7;
  string memory = 8;
  repeated string ips = 9;
  // 本次操作系统启动的唯一标识(Linux boot_id / macOS-Windows 退化临时文件)。
  // 用于 Server 端克隆冲突检测:同一 host_id 收到不同 boot_id 的心跳即判定为镜像克隆。
  string boot_id = 10;
  // Agent 在收到服务端 RESET_REGISTRATION 后,以追加随机盐的全新指纹重新注册时置 true,
  // 告知 Server 这是一台"主动声明为新主机"的机器,跳过按主机名/IP 的复用逻辑,直接接纳为新记录。
  bool force_new = 11;
}

message RegisterResponse {
  bool accepted = 1;
  string session_id = 2;
  string error = 3;
  // 克隆冲突:Server 检测到同一 host_id 来自不同 boot_id,要求 Agent 清空本地身份
  // (追加随机盐)后以全新 host_id 重新注册,使克隆出的两台机器各自获得独立 CMDB 记录。
  bool reset = 4;
  string reset_reason = 5;
}

message Heartbeat {
  int64 timestamp = 1;
  int32 active_agents = 2;
}

message CommandRequest {
  string command_id = 1;
  string target = 2;
  string action = 3;
  bytes payload = 4;
  int32 timeout_seconds = 5;
}

message CommandResponse {
  string command_id = 1;
  bool success = 2;
  bytes output = 3;
  string error = 4;
}

message AgentCommand {
  string command_id = 1;
  string agent_id = 2;
  string action = 3;
  bytes payload = 4;
}

message AgentResponse {
  string command_id = 1;
  string agent_id = 2;
  bool success = 3;
  bytes output = 4;
  string error = 5;
}
