    - StatusWithdrawn
    - StatusReopened
host: localhost:8080
info:
  contact:
    email: support@opsorigin.com
    name: OpsOrigin Team
    url: https://github.com/opsorigin/core
  description: OpsOrigin 一体化运维平台 API 文档
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: OpsOrigin API
  version: "1.0"
paths:
  /api/v1/ai/agents:
    post:
      consumes:
      - application/json
      description: 创建一个新的 AI Agent 实例
      parameters:
      - description: Agent 配置
        in: body
        name: agent
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_opsorigin_core_internal_ai_model.AgentInstance'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建 AI Agent
      tags:
      - AI
  /api/v1/cmdb/ci:
    get:
      consumes:
      - application/json
      description: |-
        获取配置项列表，支持分页、排序、过滤
        获取配置项列表，支持分页、排序、过滤
      parameters:
      - description: CI 类型 ID
        in: query
        name: type_id
        type: string
      - description: 排序字段
        in: query
        name: sort_by
        type: string
      - description: 排序方向 (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: 每页数量
        in: query
        name: limit
        type: integer
      - description: 偏移量
        in: query
        name: offset
        type: integer
      - description: 归档过滤 (true/all/空)
        in: query
        name: archived
        type: string
      - description: CI 类型 ID
        in: query
        name: type_id
        type: string
      - description: 排序字段
        in: query
        name: sort_by
        type: string
      - description: 排序方向 (asc/desc)
        in: query
        name: sort_order
        type: string
      - description: 每页数量 (默认 20)
        in: query
        name: limit
        type: integer
      - description: 偏移量 (默认 0)
        in: query
        name: offset
        type: integer
      - description: 归档过滤 (true/false)
        in: query
        name: archived
        type: string
      produces:
      - application/json
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.CIModel'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      - BearerAuth: []
      summary: 获取 CI 列表
      tags:
      - CMDB
      - CMDB
    post:
      consumes:
      - application/json
      description: 创建一个新的配置项
      parameters:
      - description: CI 信息
        in: body
        name: ci
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.CIModel'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: 创建 CI
      tags:
      - CMDB
  /api/v1/cmdb/ci/{id}:
    delete:
      description: 删除配置项
      parameters:
      - description: CI ID
        in: path
        name: id
        required: true
        type: string
      responses:
