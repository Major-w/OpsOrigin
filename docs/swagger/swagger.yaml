      scheduled_at:
        type: string
      sla_breached:
        type: boolean
      sla_breached_at:
        type: string
      sla_escalation_level:
        type: integer
      sla_warning_notified:
        type: boolean
      status:
        $ref: '#/definitions/github_com_opsorigin_core_internal_itsm_model.TicketStatus'
      tenant_id:
        type: string
      title:
        type: string
      trace_id:
        type: string
      updated_at:
        type: string
      webhook_url:
        type: string
    type: object
  github_com_opsorigin_core_internal_itsm_model.TicketStatus:
    enum:
    - draft
    - pending_review
    - approved
    - rejected
    - executing
    - succeeded
    - failed
    - rolled_back
    - closed
    - withdrawn
    - reopened
    type: string
    x-enum-comments:
      StatusReopened: 重开(closed 后重新激活)
      StatusWithdrawn: 撤回(草稿废弃)
    x-enum-descriptions:
