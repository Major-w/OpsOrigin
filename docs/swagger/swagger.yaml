        type: boolean
      process_id:
        description: 绑定的流程模板 ID
        type: string
      reject_reason:
        type: string
      related_ticket_ids:
        description: '关联工单: 与其它工单的双向关联(互相持有对方 ID)。'
        items:
          type: string
        type: array
      risk_level:
        $ref: '#/definitions/github_com_opsorigin_core_internal_itsm_model.RiskLevel'
      rollback_plan:
        type: string
      rollback_reason:
        type: string
      rolled_back_at:
        type: string
      rolled_back_by:
        type: string
      satisfaction:
