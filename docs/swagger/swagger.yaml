basePath: /
definitions:
  github_com_opsorigin_core_internal_ai_model.AgentInstance:
    properties:
      created_at:
        type: string
      id:
        type: string
      knowledge_categories:
        description: |-
          KnowledgeCategories 绑定的知识库分类列表(PRD 5.2.6)。
          非空时, 该 Agent 的 RAG 检索(系统提示注入与 knowledge_search 工具)仅在这些分类内进行;
          为空表示绑定全部知识库(默认行为, 兼容旧配置)。
        items:
          type: string
        type: array
      model_name:
        type: string
      name:
        type: string
      skills:
        description: |-
          Skills 该 Agent 具备的可复用能力定义(PRD 5.2.2)。
          每个 Skill 以"能力指令"形式注入 system prompt, 使模型了解并遵循该技能的使用方式。
        items:
          $ref: '#/definitions/github_com_opsorigin_core_internal_ai_model.AgentSkill'
        type: array
      status:
        type: string
      system_prompt:
        type: string
      tenant_id:
        type: string
      tools:
        description: |-
          Tools 该 Agent 允许使用的 MCP 工具白名单(如 ["cmdb_query","knowledge_search"])。
          非空时, 未列入的工具对模型不可见(不可调用);
          为空表示「未关联任何工具」, 引擎不向模型暴露任何工具(避免无关联却误调用)。
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  github_com_opsorigin_core_internal_ai_model.AgentSkill:
    properties:
      description:
        type: string
      instructions:
        description: 触发条件与执行步骤说明
        type: string
      name:
        type: string
    type: object
  github_com_opsorigin_core_internal_cmdb_model.AttrAggregate:
    properties:
      direction:
        description: 'Direction 关系方向: out=从本 CI 指向目标(默认), in=其他 CI 指向本 CI。'
        type: string
      op:
        description: count | sum | avg
        type: string
      relation:
        description: Relation 沿哪条关系统计(空=任意关系)。
        type: string
      target:
        description: Target sum/avg 时统计的关联 CI 属性名(count 忽略)。
        type: string
    type: object
  github_com_opsorigin_core_internal_cmdb_model.AttrDef:
    description: CI 模型属性定义，包含类型、校验规则、UI 元数据等
    properties:
      aggregate:
        allOf:
        - $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.AttrAggregate'
        description: |-
          Aggregate 聚合字段(we-cmdb count/sum/avg 借鉴):
          读取 CI 时按关系链对关联 CI 实时统计, 结果写入响应 CIModel.Aggregates。
          例: 机柜 rack 声明 {op:count, relation:hosts} → 自动统计该机柜下设备数。
      autofill:
        description: |-
          AutoFill 自动填充规则(we-cmdb autofillRule 借鉴): ref 字段选中目标 CI 后,
          自动把目标 CI 的这些属性值填入本 CI(如选机柜自动带出机房/数据中心)。
        items:
          type: string
        type: array
      default: {}
      description:
        type: string
      id:
        description: |-
          ID 是属性的稳定机器标识(属性级寻址), 供采集上报按 模型ID-字段ID 定位写入、
          以及属性级权限按字段引用。业务主键仍是字段 Name(前端寻址/展示);
          重命名字段时 ID 不变, 不破坏采集映射。旧数据无 ID 时由 ResolveModelType 兼容补全为 Name。
        type: string
      max:
        type: number
      max_length:
        description: MaxLength 文本类最大长度(string<=256 / longtext<=2000 等语义)。
        type: integer
      min:
        description: Min/Max 数值类(number/float)取值范围[Min,Max]。
        type: number
      multi:
        description: 'Multi 枚举多选: Type==enum 且 Multi=true 时, 实例值为数组(如 ["prod","dev"])。'
        type: boolean
      multiline:
        description: 'Multiline 长文本标识: Type==longtext 时用多行输入(textarea)。'
        type: boolean
      options:
        description: Options 枚举选项(select/enum 类型), 前端展示为下拉。
        items:
          type: string
        type: array
      pattern:
        description: Pattern 文本类(string/longtext)正则校验(如邮箱/手机/IP), 前端录入时校验。
        type: string
      ref_display:
        description: RefDisplay 引用型字段的展示属性(默认 name)。
        type: string
      ref_model:
        description: |-
          RefModel 引用型字段: Type=="ref" 时指向目标模型类型 ID,
          前端渲染为从该模型 CI 实例取选项的下拉选择器, 写入时校验目标 CI 存在。
        type: string
      required:
        type: boolean
      time_include:
        description: 'TimeInclude 日期类含时分秒: Type==datetime 时启用(等价 date + 时间)。'
        type: boolean
      type:
        type: string
      unique:
        description: |-
          Unique 声明该字段在「同一模型类型 + 租户」内取值唯一,
          写入/更新时由 validateAttributes 拦截重复(而非仅质量中心事后报告)。
        type: boolean
    type: object
  github_com_opsorigin_core_internal_cmdb_model.AttrMeta:
    properties:
      confidence:
        description: 0~1
        type: number
      last_seen_at:
        type: string
      source:
        $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.SourceKind'
    type: object
  github_com_opsorigin_core_internal_cmdb_model.CIModel:
    description: CI 实例，包含属性、标签、状态等信息
    properties:
      aggregates:
        additionalProperties: {}
        description: Aggregates 聚合字段计算结果(模型 schema 声明 Aggregate 时, 读取 CI 填充)。
        type: object
      attribute_meta:
        additionalProperties:
          $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.AttrMeta'
        type: object
      attributes:
        additionalProperties: {}
        type: object
      channel:
        $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.ChannelWeight'
      created_at:
        type: string
      description:
        type: string
      field_access:
        additionalProperties:
          type: string
        description: |-
          FieldAccess 字段级规则权限结果：field → hidden|readonly|visible（P2-4）。
          hidden 字段已从 attributes/attribute_meta 中剔除，前端据此渲染只读/隐藏。
        type: object
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      status:
        $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.CIStatus'
      tenant_id:
        type: string
      type_id:
        type: string
      updated_at:
        type: string
    type: object
  github_com_opsorigin_core_internal_cmdb_model.CIModelType:
    description: CI 模型类型定义，包含属性 schema 和关系声明
    properties:
      abstract:
        description: 抽象父类（不可直接实例化，仅作继承基类）
        type: boolean
      author:
        description: 模型作者，内置为 anonymous
        type: string
      builtin:
        description: 内置模型（不可删/导入导出）
        type: boolean
      category:
        description: app|platform|infra|org，默认 platform
        type: string
      confidence:
        description: 类型级置信度
        type: number
      created_at:
        type: string
      description:
        type: string
      discovered_by:
        description: 发现 / 提案主体
        type: string
      evidence:
        description: 证据（banner / 端口 / 指纹）
        items:
          type: string
        type: array
      icon:
        type: string
      id:
        type: string
      name:
        type: string
      parent_id:
        description: 模型继承：父类模型 ID
        type: string
      relations:
        description: Relations 模型级关系声明（与 Schema 并列）。声明后建关系按 TargetModel + 基数校验。
        items:
          $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.RelationDef'
        type: array
      schema:
        additionalProperties:
          $ref: '#/definitions/github_com_opsorigin_core_internal_cmdb_model.AttrDef'
        type: object
      show_in_menu:
        description: 在顶部导航菜单显示
        type: boolean
      source:
        description: |-
          类型级治理字段（为 AI 自动建模 / 类型注册表打底，与 ci.go 已有的
          字段级治理 AttrMeta{Source,Confidence,LastSeenAt} 平行互补：
          字段级管「值」的置信度，类型级管「归类」的置信度）。
        type: string
      sub_category:
        type: string
      suggested_collectors:
        items:
          type: string
        type: array
      tenant_id:
        type: string
      updated_at:
        type: string
      version:
        type: integer
    type: object
  github_com_opsorigin_core_internal_cmdb_model.CIStatus:
    enum:
    - active
    - inactive
    - archived
    - deleted
    type: string
    x-enum-comments:
      CIStatusArchived: 归档：暂时保留却不展示在普通列表，可随时恢复
    x-enum-descriptions:
    - ""
    - ""
    - 归档：暂时保留却不展示在普通列表，可随时恢复
    - ""
    x-enum-varnames:
    - CIStatusActive
    - CIStatusInactive
    - CIStatusArchived
    - CIStatusDeleted
  github_com_opsorigin_core_internal_cmdb_model.ChannelWeight:
    enum:
    - 100
    - 80
    - 50
    - 30
    type: integer
    x-enum-varnames:
    - WeightHuman
    - WeightITSM
    - WeightAutoScript
    - WeightDiscovery
  github_com_opsorigin_core_internal_cmdb_model.RelationDef:
    properties:
      cardinality:
        description: one_to_one | one_to_many | many_to_many
        type: string
      description:
        description: 说明（可选）
        type: string
      id:
        description: |-
          ID 是关系的稳定机器标识(关系级寻址), 供采集上报按 模型ID-关系ID 建立关系、
          以及属性级权限按关系引用。旧数据无 ID 时由 ResolveModelType 兼容补全为 RelationType。
        type: string
      name:
        description: 关系展示名，如 "部署于"
        type: string
      relation_type:
        description: 关系类型键（自由字符串，建议复用内置常量）
        type: string
      reverse_name:
        description: 对端显示名（可选），如 "被部署于"
        type: string
      target_model:
        description: 目标模型类型 ID
        type: string
    type: object
  github_com_opsorigin_core_internal_cmdb_model.SourceKind:
    enum:
    - manual
    - itsm
    - agent
    - cloud_api
    - auto_script
    - discovery
    - ai_proposed
    type: string
    x-enum-comments:
      SourceAIProposed: AI 自动建模提交的提案类型
      SourceAgent: 主机/容器 Agent 采集
      SourceAutoScript: 自动化脚本
      SourceCloudAPI: 云厂商 API 拉取
      SourceDiscovery: 自动发现（含模拟）
      SourceITSM: 从 ITSM 同步
      SourceManual: 人工录入（最高置信）
    x-enum-descriptions:
    - 人工录入（最高置信）
    - 从 ITSM 同步
    - 主机/容器 Agent 采集
    - 云厂商 API 拉取
    - 自动化脚本
    - 自动发现（含模拟）
    - AI 自动建模提交的提案类型
    x-enum-varnames:
    - SourceManual
    - SourceITSM
    - SourceAgent
    - SourceCloudAPI
    - SourceAutoScript
    - SourceDiscovery
    - SourceAIProposed
  github_com_opsorigin_core_internal_itsm_model.ApprovalChain:
    properties:
      approvers:
        description: 审批人列表
        items:
          type: string
        type: array
      mode:
        description: sequential(顺序) / parallel(并行)
        type: string
    type: object
  github_com_opsorigin_core_internal_itsm_model.ApprovalStatus:
    properties:
      current_index:
        description: 当前审批人索引(顺序模式)
        type: integer
      final_result:
        description: pending / approved / rejected
        type: string
      votes:
        description: 投票记录
        items:
          $ref: '#/definitions/github_com_opsorigin_core_internal_itsm_model.ApprovalVote'
        type: array
    type: object
  github_com_opsorigin_core_internal_itsm_model.ApprovalVote:
    properties:
      approved:
        type: boolean
      approver:
        type: string
      comment:
        type: string
      voted_at:
        type: string
    type: object
  github_com_opsorigin_core_internal_itsm_model.CreateTicketRequest:
    properties:
      approval_chain:
        allOf:
        - $ref: '#/definitions/github_com_opsorigin_core_internal_itsm_model.ApprovalChain'
        description: 审批链配置
      catalog_id:
        description: 发起来源的服务目录项 ID
        type: string
      change_plan:
        type: string
      ci_ids:
        items:
          type: string
        type: array
      created_by:
        type: string
      created_by_type:
        type: string
      custom_fields:
        additionalProperties: {}
        description: CustomFields 可配置表单采集的业务自定义字段（JSONB）。
        type: object
      deadline_at:
        type: string
      description:
        type: string
      form_scope:
        description: FormScope 指定本工单套用的表单作用域（默认 ticket:default）；用于目录/流程按场景套不同字段。
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      process_id:
        description: 绑定的流程模板 ID（触发流程引擎驱动）
        type: string
      risk_level:
        $ref: '#/definitions/github_com_opsorigin_core_internal_itsm_model.RiskLevel'
      rollback_plan:
        type: string
      scheduled_at:
        type: string
      title:
        type: string
      trace_id:
        type: string
      webhook_url:
        type: string
    type: object
  github_com_opsorigin_core_internal_itsm_model.RiskLevel:
    enum:
    - low
    - medium
    - high
    - critical
    type: string
    x-enum-varnames:
    - RiskLow
    - RiskMedium
    - RiskHigh
    - RiskCritical
  github_com_opsorigin_core_internal_itsm_model.Ticket:
    properties:
      approval_chain:
        allOf:
        - $ref: '#/definitions/github_com_opsorigin_core_internal_itsm_model.ApprovalChain'
        description: '审批链: 支持顺序/并行审批模式'
      approval_status:
        $ref: '#/definitions/github_com_opsorigin_core_internal_itsm_model.ApprovalStatus'
      approved_at:
        type: string
      approved_by:
        type: string
      assigned_at:
        type: string
      assignee:
        type: string
      catalog_id:
        description: 发起来源的服务目录项 ID（用于使用量统计与满意度聚合）
        type: string
      change_plan:
        type: string
      ci_ids:
        items:
          type: string
        type: array
      completed_at:
        type: string
      completed_by:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      created_by_type:
        type: string
      custom_fields:
        additionalProperties: {}
        description: |-
          CustomFields 可配置表单采集的业务自定义字段（JSONB），与系统字段并存。
          由 form.FormSchema 驱动（internal/itsm/form），无 schema 时为空。
        type: object
      deadline_at:
        type: string
      description:
        type: string
      executed_at:
        type: string
      hold_at:
