x-core-env: &core-env
  OPSNEXUS_REDIS_ADDR: redis:6379
  OPSNEXUS_REDIS_POOL_SIZE: "20"
  OPSNEXUS_POSTGRES_DSN: postgres://opsorigin:opsorigin@postgres:5432/opsorigin?sslmode=disable

x-core-ulimits: &core-ulimits
  nofile:
    soft: 65535
    hard: 65535

services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opsorigin
      POSTGRES_PASSWORD: opsorigin
      POSTGRES_DB: opsorigin
    ports: ["5432:5432"]
  core-1:
    build: .
    ports: ["8080:8080", "5588:5588", "9091:9091"]
    ulimits: *core-ulimits
    environment:
      <<: *core-env
      OPSNEXUS_CORE_PORT: "8080"
      OPSNEXUS_AGENT_WS_PORT: "5588"
      OPSNEXUS_GRPC_LISTEN: ":9091"
    depends_on: [redis, postgres]
  core-2:
    build: .
    ports: ["8081:8081", "5589:5589", "9092:9092"]
    ulimits: *core-ulimits
    environment:
      <<: *core-env
      OPSNEXUS_CORE_PORT: "8081"
      OPSNEXUS_AGENT_WS_PORT: "5589"
      OPSNEXUS_GRPC_LISTEN: ":9092"
    depends_on: [redis, postgres]
