version: "3.9"

services:
  postgres:
    # pgvector 版 PG16: 内置 vector 扩展, 支撑知识库语义检索(自动 CREATE EXTENSION + HNSW)
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: opsorigin
      POSTGRES_USER: opsorigin
      POSTGRES_PASSWORD: opsorigin
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsorigin"]
      interval: 5s
      timeout: 5s
      retries: 5

  dgraph-zero:
    image: dgraph/dgraph:v25.4.0
    restart: unless-stopped
    # v25.4.0 起 Zero admin HTTP 端点(6080)默认仅放行 loopback, 显式声明
    # whitelist 保持与 alpha 一致的信任域(compose 服务网络)。
    command: dgraph zero --my=dgraph-zero:5080 --security "whitelist=127.0.0.1,dgraph-zero,dgraph-alpha"
    ports:
      - "5080:5080"
      - "6080:6080"
    volumes:
      - dgraph_zero:/data

  dgraph-alpha:
    image: dgraph/dgraph:v25.4.0
    restart: unless-stopped
    # Restrict the Dgraph security whitelist to loopback and the compose service
    # network names. 0.0.0.0/0 exposed the entire cluster to any host that
    # could reach the port (see report issue 1.6).
    command: dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080 --security whitelist=127.0.0.1,172.19.0.1,dgraph-alpha,dgraph-zero
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    ports:
      - "7080:7080"
      - "8081:8080"
      - "9080:9080"
    depends_on:
      dgraph-zero:
        condition: service_started
    volumes:
      - dgraph_alpha:/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # 对象存储(S3 兼容): ITSM 附件等二进制落桶, DB 只存 object_key
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    environment:
      MINIO_ROOT_USER: opsorigin
      MINIO_ROOT_PASSWORD: opsorigin123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # 管理台
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    ports:
      - "8080:8080"
    environment:
      OPSORIGIN_CORE_PORT: 8080
      OPSORIGIN_POSTGRES_DSN: postgres://opsorigin:opsorigin@postgres:5432/opsorigin?sslmode=disable
      OPSORIGIN_REDIS_ADDR: redis:6379
      # 对象存储: 附件二进制进 MinIO(endpoint 留空则回退数据库存储)
      OPSORIGIN_S3_ENDPOINT: minio:9000
      OPSORIGIN_S3_ACCESS_KEY: opsorigin
      OPSORIGIN_S3_SECRET_KEY: opsorigin123
      OPSORIGIN_S3_BUCKET: opsorigin
      OPSORIGIN_S3_USE_SSL: "false"
      OPSORIGIN_S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ../web-next
      dockerfile: Dockerfile.web
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    ports:
      - "3000:3000"
    environment:
      # 容器内前端 next 代理转发到 core 服务名; 与 go run 本地直跑(默认 localhost:8080)解耦
      BACKEND_URL: http://core:8080
    volumes:
      # 源码挂载热重载; node_modules 用匿名卷隔离, 避免被 bind 覆盖
      - ../web-next:/app
      - /app/node_modules
    depends_on:
      core:
        condition: service_started

volumes:
  pg_data:
  dgraph_zero:
  dgraph_alpha:
  redis_data:
  minio_data:

# 固定网络子网: dgraph alpha 的 security whitelist 写死了宿主机 bridge 网关
# 172.19.0.1, 若不固定 subnet, 不同 compose project(或重装) 会分到 172.18.x 等
# 网段, 宿主机直连 dgraph(go run core / 集成测试)会被 "unauthorized ip" 拒绝。
networks:
  default:
    name: opsorigin-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
