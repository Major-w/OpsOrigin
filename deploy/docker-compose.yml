version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opsorigin
      POSTGRES_USER: opsorigin
      POSTGRES_PASSWORD: opsorigin
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsorigin"]
      interval: 5s
      timeout: 5s
      retries: 5

  dgraph-zero:
    image: dgraph/dgraph:v25.4.0
    # v25.4.0 起 Zero admin HTTP 端点(6080)默认仅放行 loopback, 显式声明
    # whitelist 保持与 alpha 一致的信任域(compose 服务网络)。
    command: dgraph zero --my=dgraph-zero:5080 --security "whitelist=127.0.0.1,dgraph-zero,dgraph-alpha"
    ports:
      - "5080:5080"
      - "6080:6080"
    volumes:
      - dgraph_zero:/data

  dgraph-alpha:
    image: dgraph/dgraph:v25.4.0
    # Restrict the Dgraph security whitelist to loopback and the compose service
    # network names. 0.0.0.0/0 exposed the entire cluster to any host that
    # could reach the port (see report issue 1.6).
    command: dgraph alpha --my=dgraph-alpha:7080 --zero=dgraph-zero:5080 --security whitelist=127.0.0.1,172.19.0.1,dgraph-alpha,dgraph-zero
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    ports:
      - "7080:7080"
      - "8081:8080"
      - "9080:9080"
    depends_on:
      dgraph-zero:
        condition: service_started
    volumes:
      - dgraph_alpha:/data

  redis:
    image: redis:7-alpine
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.5"
    ports:
      - "8080:8080"
    environment:
      OPSORIGIN_CORE_PORT: 8080
      OPSORIGIN_POSTGRES_DSN: postgres://opsorigin:opsorigin@postgres:5432/opsorigin?sslmode=disable
      OPSORIGIN_DGRAPH_TARGET: dgraph-alpha:9080
      OPSORIGIN_REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      dgraph-alpha:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  pg_data:
  dgraph_zero:
  dgraph_alpha:
  redis_data:
