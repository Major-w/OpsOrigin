# OpsOrigin K8s 容器资源纳管 — 网关 Agent（单副本 Deployment）
# ---------------------------------------------------------------
# 本 Deployment 以只读 ServiceAccount 运行在目标集群内，
# 作为 K8s 资源发现的网关节点：Core 经 Agent 通道向此网关下发
# `kubectl get ... -o json` 只读命令，回收 JSON 解析为五类
# Resource（cluster / namespace / workload / pod / container），
# 前端在「资源纳管 → 容器资源纳管」tab 选择本网关 Agent 即可
# 触发发现与同步。
#
# 前置条件：
#   1) 构建镜像：
#        docker build -f deploy/Dockerfile.k8s-gateway -t opsorigin/k8s-gateway:latest .
#   2) 推送镜像到目标集群可拉取的 registry：
#        docker tag opsorigin/k8s-gateway:latest <your-registry>/opsorigin/k8s-gateway:latest
#        docker push <your-registry>/opsorigin/k8s-gateway:latest
#      然后把下方 Deployment 的 image 改成该地址。
#   3) 创建 Agent 令牌 Secret（Core 侧分配的 Agent token，用于 gRPC 注册）：
#        kubectl -n opsorigin create secret generic opsorigin-agent-token \
#          --from-literal=token=<CORE_ALLOCATED_AGENT_TOKEN>
#      （Secret 不写进本清单，避免 commit 密钥。）
#   4) 设置 Core gRPC 地址（OPSORIGIN_GRPC_SERVER env，指向 Core 服务地址）。
#   5) 部署后，在 Core 的「资源纳管 → 主机资源纳管」tab 确认 Agent 上线，
#      然后在「资源纳管 → 容器资源纳管」tab 选择该 Agent 开始 K8s 资源发现。
#
# 安全设计：
#   - 仅 get / list / watch，不写、不删、不 exec，不访问 Secret；
#   - kubectl 使用 in-cluster ServiceAccount Token 自动认证（默认挂载 /var/run/secrets/...）；
#   - 脚本仅 kubectl 只读命令，不回显密钥，不拼 CLI 参数注入 env。
# ---------------------------------------------------------------

# 1) 命名空间（如已存在可删这一段）
apiVersion: v1
kind: Namespace
metadata:
  name: opsorigin
  labels:
    app.kubernetes.io/part-of: opsorigin
---
# 2) ServiceAccount：只读网关
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opsorigin-k8s-gateway
  namespace: opsorigin
  labels:
    app.kubernetes.io/name: opsorigin-k8s-gateway
    app.kubernetes.io/part-of: opsorigin
---
# 3) ClusterRole：只读 K8s 资源（与 Discoverer 五类对齐）
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opsorigin-k8s-gateway-readonly
  labels:
    app.kubernetes.io/name: opsorigin-k8s-gateway
    app.kubernetes.io/part-of: opsorigin
rules:
  # 集群名（current-context）
  - apiGroups: [""]
    resources: ["nodes"]
    verbs:   ["get", "list"]
  # 命名空间
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs:   ["get", "list", "watch"]
  # 工作负载（Deployment / StatefulSet / DaemonSet）
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs:   ["get", "list", "watch"]
  # Pod（含状态、容器信息）
  - apiGroups: [""]
    resources: ["pods"]
    verbs:   ["get", "list", "watch"]
---
# 4) ClusterRoleBinding：绑定只读角色到 SA
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opsorigin-k8s-gateway-readonly
  labels:
    app.kubernetes.io/name: opsorigin-k8s-gateway
    app.kubernetes.io/part-of: opsorigin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: opsorigin-k8s-gateway-readonly
subjects:
  - kind: ServiceAccount
    name: opsorigin-k8s-gateway
    namespace: opsorigin
---
# 5) Deployment：单副本网关 Agent
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opsorigin-k8s-gateway
  namespace: opsorigin
  labels:
    app.kubernetes.io/name: opsorigin-k8s-gateway
    app.kubernetes.io/part-of: opsorigin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opsorigin-k8s-gateway
  template:
    metadata:
      labels:
        app: opsorigin-k8s-gateway
        app.kubernetes.io/part-of: opsorigin
    spec:
      serviceAccountName: opsorigin-k8s-gateway
      containers:
        - name: opsorigin-k8s-gateway
          image: opsorigin/k8s-gateway:latest        # 构建自 deploy/Dockerfile.k8s-gateway
          imagePullPolicy: IfNotPresent
          env:
            # Core gRPC 服务地址（Agent 注册使用 gRPC，非 HTTP Core API）
            - name: OPSORIGIN_GRPC_SERVER
              value: "opsorigin-core.opsorigin.svc.cluster.local:9091"
            # Core HTTP 地址（Agent 心跳/脚本通道）
            - name: OPSORIGIN_SERVER
              value: "http://opsorigin-core.opsorigin.svc.cluster.local:8080"
            # Agent 名称（可选，缺省使用 hostname）
            - name: OPSORIGIN_AGENT_NAME
              value: "k8s-gateway"
            # Agent 注册令牌：从 Secret 注入，避免明文进 YAML
            - name: OPSORIGIN_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opsorigin-agent-token
                  key: token
                  optional: true
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      restartPolicy: Always
