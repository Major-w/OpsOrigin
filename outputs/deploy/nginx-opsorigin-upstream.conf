# OpsOrigin 多实例部署 — Nginx 负载均衡示例
# 适用: 单体多实例横向扩展(阶段 0)。前提: 各实例已切换到 PG/Redis 共享存储。
#
# 关键点:
# 1. upstream 定义实例池; 实例新增只需追加 server 行, 无需改应用。
# 2. 被动健康检查: max_fails=2 fail_timeout=30s — 连续 2 次失败后 30s 内不转发;
#    同时配合 /readyz 主动探活(见下方注释), 依赖故障时实例自动摘流。
# 3. /healthz /readyz /api/v1/health 已在应用侧 bypass 认证, LB 可直接探测。
# 4. WebSocket(/api/v1/ws)需开启 Upgrade 头透传。

upstream opsorigin_backend {
    # 被动健康检查(nginx 开源版内置)
    server 10.0.0.11:8080 max_fails=2 fail_timeout=30s;
    server 10.0.0.12:8080 max_fails=2 fail_timeout=30s;
    server 10.0.0.13:8080 max_fails=2 fail_timeout=30s;

    keepalive 32; # 复用上游连接, 降低握手开销
}

server {
    listen 80;
    server_name ops.example.com;

    # 可选: 主动健康检查(需 OpenResty/nginx-plus; 开源版可用 cron+curl 脚本替代)
    # check interval=5000 rise=2 fall=3 timeout=2000 default_down=false
    #     type=http;
    # check_http_send "GET /readyz HTTP/1.0\r\n\r\n";
    # check_http_expect_alive http_2xx http_3xx;

    location / {
        proxy_pass http://opsorigin_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持(Agent 通道 /api/v1/ws)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 探活端点直接透传(应用侧已跳过认证)
    location = /healthz { proxy_pass http://opsorigin_backend; }
    location = /readyz  { proxy_pass http://opsorigin_backend; }
    location = /metrics { proxy_pass http://opsorigin_backend; }
}

